services:
  postgres:
    image: postgres:17
    container_name: hackaton-opentusk
    environment:
      POSTGRES_DB: opentusk
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
