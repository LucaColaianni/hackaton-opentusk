# Datasource PostgreSQL: override these values with environment variables when deploying.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:root}
quarkus.datasource.password=${DB_PASSWORD:root}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/opentusk}

# OpenAPI is available at /q/openapi and Swagger UI at /q/swagger-ui (dev/test by default).
quarkus.swagger-ui.always-include=true

# React dev server (Vite default); adjust the origin if your frontend uses another port.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
